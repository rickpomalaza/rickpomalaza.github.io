<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title and page.title != 'Home' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('rick-notes-theme');
        var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    }());
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <nav aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch color theme" title="Toggle dark mode">🌙</button>
      </nav>
    </header>
    <main id="main-content">{{ content }}</main>
    <footer class="site-footer">© {{ 'now' | date: '%Y' }} Rick · <a href="{{ '/' | relative_url }}">All entries</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></footer>
  </div>
  <script src="{{ '/assets/js/more-entries.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
</body>
</html>
