---
layout: default
---
<a class="back" href="{{ '/' | relative_url }}">← Back to all entries</a>
<article class="post">
  <h1>{{ page.title | escape }}</h1>
  <div class="post-meta"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%B %-d, %Y' }}</time>{% if page.category %} · <a class="tag" href="{{ '/categories/' | append: page.category | slugify | append: '/' | relative_url }}">{{ page.category | escape }}</a>{% endif %}</div>
  <div class="post-body">{{ content }}</div>
</article>
<div class="post-end"><a href="{{ '/' | relative_url }}">← Back to all entries</a></div>
